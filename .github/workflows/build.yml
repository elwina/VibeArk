name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o dist/vibeark.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: vibeark-windows-x64
          path: dist/vibeark.exe
